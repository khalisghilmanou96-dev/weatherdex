<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WeatherDex : météo mondiale, prévisions et recherche de villes via Open-Meteo." />
  <title>WeatherDex — Météo mondiale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .ad-zone{width:100%;display:flex;justify-content:center;align-items:center;margin:30px auto;overflow:hidden}
    .ad-desktop{display:block;max-width:728px}
    .ad-mobile{display:none;max-width:320px}
    .ad-square{min-height:250px}
    @media(max-width:900px){.ad-desktop{display:none}.ad-mobile{display:block}}
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Projet GitHub Pages + Open-Meteo API</p>
        <h1>WeatherDex</h1>
        <p class="subtitle">Recherche une ville dans le monde et découvre la météo actuelle, les températures, le vent et les prévisions des prochains jours.</p>
      </div>
      <div class="hero-badge" aria-hidden="true">🌤️</div>
    </header>

    <section class="ad-zone" aria-label="Publicité">
      <div class="ad-desktop">
        <script>
          atOptions = {
            'key':'0e9f9c2b514f24e95999ab74025b3183',
            'format':'iframe',
            'height':90,
            'width':728,
            'params':{}
          };
        </script>
        <script src="https://www.highrevenueformat.com/0e9f9c2b514f24e95999ab74025b3183/invoke.js"></script>
      </div>
      <div class="ad-mobile">
        <script>
          atOptions = {
            'key':'7082f47d8ae91500e6aab5762c4fbec0',
            'format':'iframe',
            'height':50,
            'width':320,
            'params':{}
          };
        </script>
        <script src="https://www.highrevenueformat.com/7082f47d8ae91500e6aab5762c4fbec0/invoke.js"></script>
      </div>
    </section>

    <main>
      <section class="controls" aria-label="Recherche météo">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Ex. Paris, Tokyo, Montréal…" autocomplete="off" />
          <select id="unitSelect" aria-label="Unité de température">
            <option value="celsius">°C</option>
            <option value="fahrenheit">°F</option>
          </select>
          <button id="searchButton" type="button">Rechercher</button>
        </div>
        <button id="locationButton" class="secondary-button" type="button">📍 Ma position</button>
      </section>

      <section class="ad-zone ad-square" aria-label="Publicité">
        <script>
          atOptions = {
            'key':'4ff4b481288a21dec304ee4dd58b64ef',
            'format':'iframe',
            'height':250,
            'width':300,
            'params':{}
          };
        </script>
        <script src="https://www.highrevenueformat.com/4ff4b481288a21dec304ee4dd58b64ef/invoke.js"></script>
      </section>

      <p id="status" class="status" aria-live="polite"></p>

      <section>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Météo mondiale</p>
            <h2>Villes populaires</h2>
          </div>
          <button id="refreshButton" class="ghost-button" type="button">Actualiser</button>
        </div>
        <div id="weatherGrid" class="pokemon-grid"></div>
      </section>

      <section class="ad-zone ad-square" aria-label="Publicité">
        <script>
          atOptions = {
            'key':'4ff4b481288a21dec304ee4dd58b64ef',
            'format':'iframe',
            'height':250,
            'width':300,
            'params':{}
          };
        </script>
        <script src="https://www.highrevenueformat.com/4ff4b481288a21dec304ee4dd58b64ef/invoke.js"></script>
      </section>
    </main>

    <section class="ad-zone" aria-label="Publicité">
      <div class="ad-desktop">
        <script>
          atOptions = {
            'key':'0e9f9c2b514f24e95999ab74025b3183',
            'format':'iframe',
            'height':90,
            'width':728,
            'params':{}
          };
        </script>
        <script src="https://www.highrevenueformat.com/0e9f9c2b514f24e95999ab74025b3183/invoke.js"></script>
      </div>
      <div class="ad-mobile">
        <script>
          atOptions = {
            'key':'7082f47d8ae91500e6aab5762c4fbec0',
            'format':'iframe',
            'height':50,
            'width':320,
            'params':{}
          };
        </script>
        <script src="https://www.highrevenueformat.com/7082f47d8ae91500e6aab5762c4fbec0/invoke.js"></script>
      </div>
    </section>
  </div>

  <dialog id="weatherDialog" class="pokemon-dialog">
    <button id="closeDialogButton" class="close-button" type="button" aria-label="Fermer">×</button>
    <div id="weatherDetails"></div>
  </dialog>

  <template id="weatherCardTemplate">
    <article class="pokemon-card">
      <div class="card-topline">
        <span class="weather-country"></span>
        <span class="card-arrow">↗</span>
      </div>
      <div class="weather-icon" aria-hidden="true"></div>
      <div class="card-content">
        <h3 class="pokemon-name"></h3>
        <div class="pokemon-types"></div>
        <div class="price-row">
          <strong class="weather-temp"></strong>
          <span class="weather-condition"></span>
        </div>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
